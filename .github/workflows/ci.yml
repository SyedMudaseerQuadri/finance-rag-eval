name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light deps (heavy models are mocked in tests)
        run: pip install numpy requests fastapi httpx pytest ruff
      - run: ruff check .
      - run: pytest -q
